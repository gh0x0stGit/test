    <p>Attempt to list all methods of the detected Bridge.</p>
    <button class="btn" onclick="fuzzBridge()">Fuzz 'iabjs_unified_bridge'</button>
    <div id="fuzz-res" class="result-box"></div>

<script>
function testTabNabbing() {
    alert("Check if the previous tab/window redirects after this!");
    if (window.opener) window.opener.location = "https://google.com";
}

function fuzzBridge() {
    try {
        let methods = Object.getOwnPropertyNames(iabjs_unified_bridge);
        document.getElementById('fuzz-res').innerText = "Methods: " + methods.join(", ");
    } catch(e) {
        document.getElementById('fuzz-res').innerText = "Bridge not accessible or error: " + e;
    }
}
</script>
