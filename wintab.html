<div class="card">
    <h2>Stealth Port Scanner (No-Prompt)</h2>
    <button onclick="stealthScan()">Run Stealth Scan</button>
    <div id="results" style="color: yellow; margin-top: 10px;"></div>
</div>

<script>
function stealthScan() {
    const ports = [6463, 3000, 8080, 5000]; // Discord, etc.
    const results = document.getElementById('results');
    
    ports.forEach(port => {
        const start = performance.now();
        // Image tag fetch alerts ko trigger nahi karta aksar
        const img = new Image();
        
        img.onload = img.onerror = () => {
            const end = performance.now();
            const duration = end - start;
            // Agar port open hai, toh response fast (ya specific error) aayega
            if (duration < 100) { 
                results.innerHTML += `<br>Port ${port} is likely ACTIVE (Time: ${duration.toFixed(2)}ms)`;
            }
        };
        
        img.src = `http://127.0.0.1:${port}/favicon.ico?t=${start}`;
    });
}
</script>
