<!DOCTYPE html>
<html>
<head>
    <title>Instagram Security Auditor</title>
    <style>
        body { background: #fafafa; color: #262626; font-family: sans-serif; padding: 20px; text-align: center; }
        .card { border: 1px solid #dbdbdb; background: #fff; padding: 20px; border-radius: 8px; max-width: 400px; margin: auto; }
        .btn { background: #0095f6; color: #fff; border: none; padding: 10px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .res { margin-top: 10px; font-size: 12px; color: #ed4956; font-family: monospace; }
    </style>
</head>
<body>

    <div class="card">
        <h2>IG Browser Probe</h2>
        <p>Testing for Information Leakage in IG's Sandbox.</p>
        
        <button class="btn" onclick="testDeepLink()">Test Deep-Link Hijack</button>
        <div id="log1" class="res">> Ready</div>

        <button class="btn" onclick="testClip()">Probe Clipboard</button>
        <div id="log2" class="res">> Ready</div>

        <button class="btn" onclick="testAccess()">Test Cookie Access</button>
        <div id="log3" class="res">> Ready</div>
    </div>

<script>
    function testDeepLink() {
        // Attempting to force open Instagram settings from the browser
        window.location.href = "instagram://settings";
        document.getElementById('log1').innerText = "[!] Triggered: instagram://settings";
    }

    async function testClip() {
        try {
            const text = await navigator.clipboard.readText();
            document.getElementById('log2').innerText = "[!] LEAK: Clipboard Content: " + text;
        } catch(e) {
            document.getElementById('log2').innerText = "[X] Blocked (Secure)";
        }
    }

    function testAccess() {
        // Checking if the browser leaks any cross-origin cookies
        document.getElementById('log3').innerText = "Cookies Found: " + (document.cookie || "None (Secure)");
    }
</script>
</body>
</html>
